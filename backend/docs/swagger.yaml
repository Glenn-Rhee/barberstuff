host: localhost:8080
info:
  contact: {}
  description: Dokumentasi API untuk backend BarberStuff
  title: BarberStuff Backend API
  version: "1.0"
paths:
  /auth/forgot:
    post:
      consumes:
      - application/json
      description: Mengirimkan kode OTP ke email untuk proses reset password
      parameters:
      - description: Email customer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil kirim otp
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ForgotPassswordResponse'
              type: object
        "406":
          description: Gagal mengirim otp
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Lupa password
      tags:
      - Customer
  /auth/login/credential:
    post:
      consumes:
      - application/json
      description: Melakukan autentikasi menggunakan kombinasi email dan password,
        mengembalikan access token
      parameters:
      - description: Kredensial login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CredentialLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login Berhasil!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthenticationResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Login menggunakan email & password
      tags:
      - Auth
  /auth/provider:
    post:
      consumes:
      - application/json
      description: Melakukan autentikasi menggunakan provider pihak ketiga seperti
        Google
      parameters:
      - description: Data ID token dan provider
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AuthProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login Berhasil!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthProviderResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Login/registrasi melalui OAuth provider
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Membuat access token baru menggunakan refresh token yang masih
        valid
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenBody'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RefreshTokenBody'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Perbarui access token
      tags:
      - Auth
  /auth/register/admin:
    post:
      consumes:
      - application/json
      description: Membuat akun admin pertama kali menggunakan Secret-Key khusus pada
        header
      parameters:
      - description: Secret key admin
        in: header
        name: Secret-Key
        required: true
        type: string
      - description: Data akun admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StaffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil membuat akun admin
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Secret key tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Buat akun admin
      tags:
      - Staff
  /auth/register/credential:
    post:
      consumes:
      - application/json
      description: Mendaftarkan customer baru menggunakan email dan password, OTP
        akan dikirim ke email
      parameters:
      - description: Data registrasi customer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CredentialCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP telah dikirim ke email Anda
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CredentialCustomerResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "406":
          description: Registrasi gagal
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Registrasi customer baru
      tags:
      - Customer
  /auth/register/oauth:
    post:
      consumes:
      - application/json
      description: Melengkapi data diri customer baru yang mendaftar melalui provider
        OAuth (Google, dll)
      parameters:
      - description: Data registrasi OAuth
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OauthCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil registrasi dengan google!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthenticationResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Registrasi customer melalui OAuth
      tags:
      - Customer
  /auth/reset:
    post:
      consumes:
      - application/json
      description: Mengganti password menggunakan reset token yang telah diverifikasi
      parameters:
      - description: Reset token dan password baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password berhasil direset!
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Reset password
      tags:
      - Auth
  /auth/verify-credential:
    post:
      consumes:
      - application/json
      description: Memverifikasi kode OTP yang dikirim saat proses registrasi customer
      parameters:
      - description: User ID dan kode OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyCredentialRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil verifikasi!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.VerifyOTPResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "406":
          description: Verifikasi gagal
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Verifikasi OTP registrasi
      tags:
      - Customer
  /benefit:
    get:
      consumes:
      - application/json
      description: Admin dan customer dapat melihat daftar benefit dengan filter pencarian,
        status, pengurutan, dan pagination. Field status hanya disertakan dalam respons
        untuk admin, sedangkan customer tidak menerima field tersebut.
      parameters:
      - description: Pencarian berdasarkan judul atau deskripsi benefit
        in: query
        name: q
        type: string
      - description: Filter status benefit
        enum:
        - visible
        - hide
        in: query
        name: status
        type: string
      - description: Kolom pengurutan
        enum:
        - title
        - status
        - created_at
        in: query
        name: sort_by
        type: string
      - default: 1
        description: Nomor halaman
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Jumlah data per halaman
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Urutan pengurutan
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengambil daftar benefit
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Parameter tidak valid atau gagal mengambil data benefit
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Anda tidak memiliki akses
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: Mendapatkan daftar benefit
      tags:
      - Benefit
    post:
      consumes:
      - application/json
      description: Admin dapat membuat benefit baru dengan mengisi judul, deskripsi,
        URL gambar, dan status benefit.
      parameters:
      - description: Data benefit baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBenefitReq'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil membuat benefit baru
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Parameter tidak valid atau gagal membuat benefit
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Anda tidak memiliki akses
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: Membuat benefit baru
      tags:
      - Benefit
  /benefit/{id}:
    delete:
      consumes:
      - application/json
      description: Admin menghapus benefit secara permanen dari database (hard delete).
      parameters:
      - description: ID benefit
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil menghapus benefit
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Gagal menghapus benefit
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Anda tidak memiliki akses
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: Menghapus benefit
      tags:
      - Benefit
    patch:
      consumes:
      - application/json
      description: Admin dapat mengubah satu atau beberapa field benefit tanpa harus
        mengirim seluruh data.
      parameters:
      - description: ID benefit
        in: path
        name: id
        required: true
        type: string
      - description: Data benefit yang akan diperbarui
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.PatchBenefitReq'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil mengubah benefit
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Parameter tidak valid atau gagal mengubah benefit
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Anda tidak memiliki akses
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: Mengubah data benefit
      tags:
      - Benefit
  /booking:
    get:
      description: Mengambil daftar booking berdasarkan status booking, dapat difilter
        berdasarkan nama customer dan diurutkan berdasarkan jadwal booking atau nama
        customer. Data booking ini ditampilkan khusus untuk kasir
      parameters:
      - description: Pencarian berdasarkan nama customer, nama capster, atau nama
          service
        in: query
        name: q
        type: string
      - description: Status booking
        enum:
        - booked
        - progress
        - completed
        - canceled
        in: query
        name: status_booking
        type: string
      - default: scheduled_at
        description: Kolom untuk pengurutan
        enum:
        - scheduled_at
        - name
        in: query
        name: sort_by
        type: string
      - default: 1
        description: Page
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Limit
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Urutan data
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Succes get data bookings
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.GetBookingsResponse'
                  type: array
                meta:
                  $ref: '#/definitions/dto.ResponsePagination'
              type: object
        "400":
          description: Parameter tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Anda tidak memiliki akses
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "406":
          description: Gagal mengambil data bookings
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: Daftar booking
      tags:
      - Booking
    post:
      consumes:
      - application/json
      description: Membuat booking baru untuk service, capster, dan toko tertentu,
        mengembalikan detail booking beserta QR code. Hanya dapat diakses oleh customer
      parameters:
      - description: Data booking yang akan dibuat
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil membuat booking!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CreateBookingResponse'
              type: object
        "400":
          description: Data tidak valid / gagal membuat booking
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Tidak memiliki akses
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: Buat booking baru
      tags:
      - Booking
  /booking/customer:
    get:
      description: Mengambil daftar booking milik customer yang sedang login berdasarkan
        status booking, dapat difilter berdasarkan nama dan diurutkan berdasarkan
        jadwal booking atau nama toko.
      parameters:
      - description: Status booking
        enum:
        - upcoming
        - done
        - cancel
        in: query
        name: status_booking
        required: true
        type: string
      - description: Pencarian berdasarkan nama
        in: query
        name: q
        type: string
