        - completed
        - canceled
        in: query
        name: status_booking
        type: string
      - default: scheduled_at
        description: Kolom untuk pengurutan
        enum:
        - scheduled_at
        - name
        in: query
        name: sort_by
        type: string
      - default: 1
        description: Page
        in: query
        minimum: 1
        name: page
        type: integer
      - default: 20
        description: Limit
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - default: desc
        description: Urutan data
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
