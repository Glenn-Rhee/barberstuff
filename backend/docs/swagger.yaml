basePath: /
definitions:
  dto.AuthProviderRequest:
    properties:
      id_token:
        type: string
      provider:
        allOf:
        - $ref: '#/definitions/dto.Provider'
        enum:
        - google
    required:
    - id_token
    type: object
  dto.AuthProviderResponse:
    properties:
      access_token:
        type: string
      email:
        type: string
      name:
        type: string
      status:
        $ref: '#/definitions/dto.StatusAuth'
      temp_token:
        type: string
    type: object
  dto.AuthenticationResponse:
    properties:
      access_token:
        type: string
      user:
        $ref: '#/definitions/dto.UserAuth'
    type: object
  dto.CapsterAvailable:
    properties:
      available:
        type: boolean
      avg_rating:
        type: number
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
    type: object
  dto.CapsterDataResponse:
    properties:
      avg_rating:
        type: number
      created_at:
        type: string
      id:
        type: string
      id_store:
        type: string
      image_url:
        type: string
      name:
        type: string
      status:
        $ref: '#/definitions/entity.CapsterStatusEnum'
    type: object
  dto.CreateAccountStaffRequest:
    properties:
      email:
        type: string
      id_store:
        type: string
      name:
        minLength: 3
        type: string
      role:
        allOf:
        - $ref: '#/definitions/entity.RoleEnum'
        enum:
        - cashier
        - mitra
    required:
    - email
    - id_store
    - name
    - role
    type: object
  dto.CreateBookingRequest:
    properties:
      booking_date:
        type: string
      id_capster:
        type: string
      id_promo_claimed:
        type: string
      id_service:
        type: string
      id_store:
        type: string
    required:
    - booking_date
    - id_capster
    - id_service
    - id_store
    type: object
  dto.CreateBookingResponse:
    properties:
      app_service_fee:
        type: integer
      booking_date:
        type: string
      capster:
        $ref: '#/definitions/dto.DataCapsterBooking'
      id_booking:
        type: string
      qr_code:
        type: string
      service:
        items:
          $ref: '#/definitions/dto.DataServiceBooking'
        type: array
      store:
        $ref: '#/definitions/dto.DataStoreBooking'
      total_price:
        type: number
    type: object
  dto.CreateCapsterRequest:
    properties:
      id_store:
        type: string
      image_url:
        type: string
      name:
        minLength: 3
        type: string
    required:
    - id_store
    - name
    type: object
  dto.CredentialCustomerRequest:
    properties:
      date_of_birth:
        type: string
      email:
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/entity.Gender'
        enum:
        - male
        - female
      image_url:
        type: string
      name:
        type: string
      password:
        minLength: 5
        type: string
      phoneNumber:
        maxLength: 15
        minLength: 9
        type: string
    required:
    - date_of_birth
    - email
    - gender
    - name
    - password
    - phoneNumber
    type: object
  dto.CredentialCustomerResponse:
    properties:
      email:
        type: string
      id:
        type: string
    type: object
  dto.CredentialLoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 5
        type: string
    required:
    - email
    - password
    type: object
  dto.CustomerResponseRating:
    properties:
      id:
        type: string
      image_url:
        type: string
      name:
        type: string
      premium_type:
        type: string
    type: object
  dto.DataCapsterBooking:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  dto.DataServiceBooking:
    properties:
      id:
        type: string
      name:
        type: string
      price:
        type: number
    type: object
  dto.DataStoreBooking:
    properties:
      address:
        type: string
      id:
        type: string
      name:
        type: string
      phone_number:
        type: string
    type: object
  dto.ForgotPassswordResponse:
    properties:
      user_id:
        type: string
    type: object
  dto.ForgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  dto.GetBookingStoreResponse:
    properties:
      date:
        type: string
      id_store:
        type: string
      slots:
        items:
          $ref: '#/definitions/dto.SlotAvailable'
        type: array
    type: object
  dto.GetServiceResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      id_store:
        type: string
      price:
        type: number
      status:
        $ref: '#/definitions/entity.ProductStatusEnum'
      string:
        type: string
      type:
        $ref: '#/definitions/entity.ProductTypeEnum'
    type: object
  dto.LockBookingRequest:
    properties:
      booking_date:
        type: string
      id_capster:
        type: string
      id_store:
        type: string
    required:
    - booking_date
    - id_capster
    - id_store
    type: object
  dto.NewStoreRequest:
    properties:
      address:
        type: string
      banner_url:
        type: string
      close_hour:
        type: string
      description:
        type: string
      lat:
        type: number
      long:
        type: number
      name:
        type: string
      open_hour:
        type: string
      phone_number:
        maxLength: 15
        minLength: 9
        type: string
      store_type:
        allOf:
        - $ref: '#/definitions/entity.StoreTypeEnum'
        enum:
        - lite
        - premium
      timezone:
        allOf:
        - $ref: '#/definitions/entity.StoreTimezoneEnum'
        enum:
        - Asia/Jakarta
        - Asia/Makassar
        - Asia/Jayapura
    required:
    - address
    - banner_url
    - close_hour
    - lat
    - long
    - name
    - open_hour
    - phone_number
    - store_type
    - timezone
    type: object
  dto.OauthCustomerRequest:
    properties:
      date_of_birth:
        type: string
      gender:
        allOf:
        - $ref: '#/definitions/entity.Gender'
        enum:
        - male
        - female
      image_url:
        type: string
      name:
        type: string
      phoneNumber:
        maxLength: 15
        minLength: 9
        type: string
      temp_token:
        type: string
    required:
    - date_of_birth
    - gender
    - name
    - phoneNumber
    - temp_token
    type: object
  dto.ProfileCustomerResponse:
    properties:
      created_at:
        type: string
      date_of_birth:
        type: string
      email:
        type: string
      gender:
        $ref: '#/definitions/entity.Gender'
      id:
        type: string
      image_url:
        type: string
      is_verified:
        type: boolean
      login_type:
        $ref: '#/definitions/entity.LoginType'
      member_points:
        type: integer
      name:
        type: string
      oauth_provider:
        type: string
      phone_number:
        type: string
      premium_type:
        type: string
      role:
        $ref: '#/definitions/entity.RoleEnum'
    type: object
  dto.Provider:
    enum:
    - google
    type: string
    x-enum-varnames:
    - Google
  dto.RefreshTokenBody:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  dto.ResetPasswordRequest:
    properties:
      new_password:
        minLength: 5
        type: string
      reset_token:
        type: string
    required:
    - new_password
    - reset_token
    type: object
  dto.ResponsePagination:
    properties:
      limit:
        type: integer
      page:
        type: integer
      total_data:
        type: integer
      total_pages:
        type: integer
    type: object
  dto.Review:
    properties:
      id:
        type: string
      message:
        type: string
      rating:
        type: integer
      user:
        $ref: '#/definitions/dto.CustomerResponseRating'
    type: object
  dto.SlotAvailable:
    properties:
      available:
        type: boolean
      capsters:
        items:
          $ref: '#/definitions/dto.CapsterAvailable'
        type: array
      time:
        type: string
    type: object
  dto.StaffAccountsResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      id_store:
        type: string
      name:
        type: string
      role:
        $ref: '#/definitions/entity.RoleEnum'
    type: object
  dto.StaffRequest:
    properties:
      email:
        type: string
      name:
        type: string
      password:
        minLength: 5
        type: string
    required:
    - email
    - name
    - password
    type: object
  dto.StatusAuth:
    enum:
    - NEED_COMPLETE_PROFILE
    - SUCCESS
    type: string
    x-enum-varnames:
    - NEED_COMPLETE_PROFILE
    - SUCCESS
  dto.StatusResponse:
    enum:
    - success
    - failed
    type: string
    x-enum-varnames:
    - StatusSuccess
    - StatusFailed
  dto.StoreData:
    properties:
      address:
        type: string
      avg_rating:
        type: number
      banner_url:
        type: string
      close_hour:
        type: string
      coordinate:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      open_hour:
        type: string
      phone_number:
        type: string
      review:
        items:
          $ref: '#/definitions/dto.Review'
        type: array
      status:
        $ref: '#/definitions/entity.StoreStatusEnum'
      store_type:
        $ref: '#/definitions/entity.StoreTypeEnum'
      total_capster:
        type: integer
      total_package:
        type: integer
      total_service:
        type: integer
    type: object
  dto.SwaggerResponse:
    properties:
      data: {}
      message:
        type: string
      meta: {}
      status:
        $ref: '#/definitions/dto.StatusResponse'
      statusCode:
        type: integer
    type: object
  dto.UpdateAccountStaffRequest:
    properties:
      name:
        minLength: 3
        type: string
      password:
        minLength: 5
        type: string
    required:
    - name
    - password
    type: object
  dto.UpdateStoreRequest:
    properties:
      address:
        type: string
      banner_url:
        type: string
      close_hour:
        type: string
      description:
        type: string
      lat:
        type: number
      long:
        type: number
      name:
        type: string
      open_hour:
        type: string
      phone_number:
        maxLength: 15
        minLength: 9
        type: string
      status:
        allOf:
        - $ref: '#/definitions/entity.StoreStatusEnum'
        enum:
        - open
        - close
      store_type:
        allOf:
        - $ref: '#/definitions/entity.StoreTypeEnum'
        enum:
        - lite
        - premium
      timezone:
        allOf:
        - $ref: '#/definitions/entity.StoreTimezoneEnum'
        enum:
        - Asia/Jakarta
        - Asia/Makassar
        - Asia/Jayapura
    required:
    - address
    - banner_url
    - close_hour
    - lat
    - long
    - name
    - open_hour
    - phone_number
    - status
    - store_type
    - timezone
    type: object
  dto.UserAuth:
    properties:
      email:
        type: string
      role:
        $ref: '#/definitions/entity.RoleEnum'
      user_id:
        type: string
    type: object
  dto.VerifyCredentialRequest:
    properties:
      otp:
        type: string
      user_id:
        type: string
    required:
    - otp
    - user_id
    type: object
  dto.VerifyOTPResponse:
    properties:
      reset_token:
        type: string
    type: object
  entity.CapsterStatusEnum:
    enum:
    - active
    - inactive
    type: string
    x-enum-varnames:
    - CapsterStatusActive
    - CapsterStatusInactive
  entity.Gender:
    enum:
    - Male
    - Female
    type: string
    x-enum-varnames:
    - GenderMale
    - GenderFemale
  entity.LoginType:
    enum:
    - OAuth
    - Credential
    type: string
    x-enum-varnames:
    - LoginWithOAuth
    - LoginWithCredential
  entity.ProductStatusEnum:
    enum:
    - active
    - inactive
    type: string
    x-enum-varnames:
    - ProductStatusActive
    - ProductStatusInactive
  entity.ProductTypeEnum:
    enum:
    - service
    - package
    type: string
    x-enum-varnames:
    - TypeService
    - TypePackage
  entity.RoleEnum:
    enum:
    - customer
    - cashier
    - admin
    - mitra
    type: string
    x-enum-varnames:
    - RoleCustomer
    - RoleCashier
    - RoleAdmin
    - RoleMitra
  entity.StoreStatusEnum:
    enum:
    - open
    - close
    type: string
    x-enum-varnames:
    - StoreStatusOpen
    - StoreStatusClose
  entity.StoreTimezoneEnum:
    enum:
    - Asia/Jakarta
    - Asia/Makassar
    - Asia/Jayapura
    type: string
    x-enum-varnames:
    - TimezoneJakarta
    - TimezoneMakassar
    - TimezoneJayapura
  entity.StoreTypeEnum:
    enum:
    - lite
    - premium
    type: string
    x-enum-varnames:
    - StoreLite
    - StorePremium
host: localhost:8080
info:
  contact: {}
  description: Dokumentasi API untuk backend BarberStuff
  title: BarberStuff Backend API
  version: "1.0"
paths:
  /auth/forgot:
    post:
      consumes:
      - application/json
      description: Mengirimkan kode OTP ke email untuk proses reset password
      parameters:
      - description: Email customer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil kirim otp
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ForgotPassswordResponse'
              type: object
        "406":
          description: Gagal mengirim otp
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Lupa password
      tags:
      - Customer
  /auth/login/credential:
    post:
      consumes:
      - application/json
      description: Melakukan autentikasi menggunakan kombinasi email dan password,
        mengembalikan access token
      parameters:
      - description: Kredensial login
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CredentialLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login Berhasil!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthenticationResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Login menggunakan email & password
      tags:
      - Auth
  /auth/provider:
    post:
      consumes:
      - application/json
      description: Melakukan autentikasi menggunakan provider pihak ketiga seperti
        Google
      parameters:
      - description: Data ID token dan provider
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.AuthProviderRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login Berhasil!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthProviderResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Login/registrasi melalui OAuth provider
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Membuat access token baru menggunakan refresh token yang masih
        valid
      parameters:
      - description: Refresh token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.RefreshTokenBody'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.RefreshTokenBody'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Perbarui access token
      tags:
      - Auth
  /auth/register/admin:
    post:
      consumes:
      - application/json
      description: Membuat akun admin pertama kali menggunakan Secret-Key khusus pada
        header
      parameters:
      - description: Secret key admin
        in: header
        name: Secret-Key
        required: true
        type: string
      - description: Data akun admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.StaffRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil membuat akun admin
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Secret key tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Buat akun admin
      tags:
      - Staff
  /auth/register/credential:
    post:
      consumes:
      - application/json
      description: Mendaftarkan customer baru menggunakan email dan password, OTP
        akan dikirim ke email
      parameters:
      - description: Data registrasi customer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CredentialCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OTP telah dikirim ke email Anda
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CredentialCustomerResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "406":
          description: Registrasi gagal
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Registrasi customer baru
      tags:
      - Customer
  /auth/register/oauth:
    post:
      consumes:
      - application/json
      description: Melengkapi data diri customer baru yang mendaftar melalui provider
        OAuth (Google, dll)
      parameters:
      - description: Data registrasi OAuth
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.OauthCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil registrasi dengan google!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.AuthenticationResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Registrasi customer melalui OAuth
      tags:
      - Customer
  /auth/reset:
    post:
      consumes:
      - application/json
      description: Mengganti password menggunakan reset token yang telah diverifikasi
      parameters:
      - description: Reset token dan password baru
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ResetPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Password berhasil direset!
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Reset password
      tags:
      - Auth
  /auth/verify-credential:
    post:
      consumes:
      - application/json
      description: Memverifikasi kode OTP yang dikirim saat proses registrasi customer
      parameters:
      - description: User ID dan kode OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.VerifyCredentialRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil verifikasi!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.VerifyOTPResponse'
              type: object
        "400":
          description: Data tidak valid
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "406":
          description: Verifikasi gagal
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Verifikasi OTP registrasi
      tags:
      - Customer
  /booking:
    post:
      consumes:
      - application/json
      description: Membuat booking baru untuk service, capster, dan toko tertentu,
        mengembalikan detail booking beserta QR code. Hanya dapat diakses oleh customer
      parameters:
      - description: Data booking yang akan dibuat
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil membuat booking!
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.CreateBookingResponse'
              type: object
        "400":
          description: Data tidak valid / gagal membuat booking
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Tidak memiliki akses
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: Buat booking baru
      tags:
      - Booking
  /booking/lock:
    post:
      consumes:
      - application/json
      description: Mengunci slot booking (capster, toko, dan tanggal tertentu) agar
        tidak bisa dipesan customer lain untuk sementara waktu. Hanya dapat diakses
        oleh customer
      parameters:
      - description: Data booking yang akan dikunci
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.LockBookingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil Lock booking!
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "400":
          description: Data tidak valid / gagal lock booking
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
        "401":
          description: Tidak memiliki akses
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      security:
      - BearerAuth: []
      summary: Kunci slot booking
      tags:
      - Booking
  /booking/store:
    get:
      description: Mengambil data slot waktu, ketersediaan, dan daftar capster yang
        tersedia pada toko dan tanggal tertentu
      parameters:
