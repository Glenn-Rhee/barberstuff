host: localhost:8080
info:
  contact: {}
  description: Dokumentasi API untuk backend BarberStuff
  title: BarberStuff Backend API
  version: "1.0"
paths:
  /auth/forgot:
    post:
      consumes:
      - application/json
      description: Mengirimkan kode OTP ke email untuk proses reset password
      parameters:
      - description: Email customer
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.ForgotPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Berhasil kirim otp
          schema:
            allOf:
            - $ref: '#/definitions/dto.SwaggerResponse'
            - properties:
                data:
                  $ref: '#/definitions/dto.ForgotPassswordResponse'
              type: object
        "406":
          description: Gagal mengirim otp
          schema:
            $ref: '#/definitions/dto.SwaggerResponse'
      summary: Lupa password
      tags:
      - Customer
  /auth/login/credential:
    post:
      consumes:
      - application/json
      description: Melakukan autentikasi menggunakan kombinasi email dan password,
